resources:
  jobs:
    mlflow_evals_workshop_pipeline:
      name: "MLflow GenAI evaluation workshop - end to end"

      # Serverless compute for the entire job
      environments:
        - environment_key: serverless
          spec:
            client: "1"
            dependencies:
              - mlflow
              - databricks-sdk
              - databricks-agents

      # Note on base_parameters: the notebooks resolve EXPERIMENT_PATH from the
      # current Databricks user inside `_resources/setup.py`. Passing
      # experiment_path here would require the notebooks to read
      # dbutils.widgets.get(...), which they intentionally don't, so the bundle
      # variable lives in databricks.yml for documentation only.

      tasks:
        - task_key: pre_flight
          environment_key: serverless
          notebook_task:
            notebook_path: ../notebooks/01_pre_flight_check.py

        - task_key: agent_app
          environment_key: serverless
          depends_on:
            - task_key: pre_flight
          notebook_task:
            notebook_path: ../notebooks/02_agent_app.py

        - task_key: capture_assessments
          environment_key: serverless
          depends_on:
            - task_key: agent_app
          notebook_task:
            notebook_path: ../notebooks/03_capture_assessments.py

        - task_key: offline_evals
          environment_key: serverless
          depends_on:
            - task_key: capture_assessments
          notebook_task:
            notebook_path: ../notebooks/04_offline_evals.py

        - task_key: judge_alignment
          environment_key: serverless
          depends_on:
            - task_key: offline_evals
          notebook_task:
            notebook_path: ../notebooks/05_judge_alignment.py

        - task_key: production_monitoring
          environment_key: serverless
          depends_on:
            - task_key: judge_alignment
          notebook_task:
            notebook_path: ../notebooks/06_production_monitoring.py

        - task_key: otel_uc_integration
          environment_key: serverless
          depends_on:
            - task_key: production_monitoring
          notebook_task:
            notebook_path: ../notebooks/07_otel_uc_integration.py
            base_parameters:
              trace_catalog: ${var.trace_catalog}
              trace_schema: ${var.trace_schema}

        - task_key: deploy_agent
          environment_key: serverless
          depends_on:
            - task_key: otel_uc_integration
          notebook_task:
            notebook_path: ../notebooks/08_deploy_agent.py
