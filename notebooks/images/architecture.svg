<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 980" width="1080" height="980" role="img" aria-label="MLflow GenAI evaluation workshop architecture">
  <defs>
    <style>
      .label { font: 600 18px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #7d8590; }
      .title { font: 700 30px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #7d8590; }
      .box-title { font: 600 15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Mono", Menlo, monospace; fill: #ffffff; opacity: 0.85; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <text x="540" y="50" class="title" text-anchor="middle">MLflow GenAI evaluation workshop</text>

  <text x="40" y="120" class="label">1 / Application &amp; tracing</text>

  <g>
    <rect x="40" y="140" width="240" height="90" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="160" y="178" class="box-title" text-anchor="middle">Your RAG agent</text>
    <text x="160" y="200" class="box-sub" text-anchor="middle">retrieve + generate</text>
  </g>

  <g>
    <rect x="380" y="140" width="280" height="90" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="520" y="178" class="box-title" text-anchor="middle">MLflow trace tree</text>
    <text x="520" y="200" class="box-sub" text-anchor="middle">chain to retrieve to LLM</text>
  </g>

  <g>
    <rect x="760" y="140" width="280" height="90" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="900" y="178" class="box-title" text-anchor="middle">Trace metadata</text>
    <text x="900" y="200" class="box-sub" text-anchor="middle">user / session / tags</text>
  </g>

  <path d="M 280 185 L 372 185" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 660 185 L 752 185" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="40" y="290" class="label">2 / Capture human feedback</text>

  <g>
    <rect x="40" y="310" width="280" height="90" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="180" y="348" class="box-title" text-anchor="middle">In-app feedback</text>
    <text x="180" y="370" class="box-sub" text-anchor="middle">mlflow.log_feedback</text>
  </g>

  <g>
    <rect x="760" y="310" width="280" height="90" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="900" y="348" class="box-title" text-anchor="middle">Review App</text>
    <text x="900" y="370" class="box-sub" text-anchor="middle">SME batch annotation</text>
  </g>

  <path d="M 180 232 L 180 302" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 900 232 L 900 302" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="40" y="460" class="label">3 / Apply automated scorers</text>

  <g>
    <rect x="40" y="480" width="280" height="90" rx="10" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
    <text x="180" y="518" class="box-title" text-anchor="middle">Code-based scorers</text>
    <text x="180" y="540" class="box-sub" text-anchor="middle">@scorer decorator</text>
  </g>

  <g>
    <rect x="760" y="480" width="280" height="90" rx="10" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
    <text x="900" y="518" class="box-title" text-anchor="middle">LLM-as-a-judge</text>
    <text x="900" y="540" class="box-sub" text-anchor="middle">make_judge</text>
  </g>

  <g>
    <rect x="40" y="600" width="280" height="80" rx="10" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
    <text x="180" y="636" class="box-title" text-anchor="middle">Offline batch</text>
    <text x="180" y="656" class="box-sub" text-anchor="middle">mlflow.genai.evaluate</text>
  </g>

  <g>
    <rect x="760" y="600" width="280" height="80" rx="10" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
    <text x="900" y="630" class="box-title" text-anchor="middle">Scheduled scorers</text>
    <text x="900" y="648" class="box-sub" text-anchor="middle">register + start (Beta)</text>
    <text x="900" y="666" class="box-sub" text-anchor="middle" style="opacity: 0.7">sampling: 5-100%</text>
  </g>

  <path d="M 180 572 L 180 592" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 900 572 L 900 592" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="40" y="730" class="label">4 / Store in Unity Catalog</text>

  <g>
    <rect x="380" y="750" width="320" height="100" rx="10" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
    <text x="540" y="790" class="box-title" text-anchor="middle">Traces in Unity Catalog</text>
    <text x="540" y="812" class="box-sub" text-anchor="middle">Delta table (Public Preview)</text>
    <text x="540" y="832" class="box-sub" text-anchor="middle" style="opacity: 0.7">SQL-queryable, ACL-governed</text>
  </g>

  <path d="M 180 682 L 380 750" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 900 682 L 700 750" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <text x="40" y="900" class="label">5 / Consume downstream</text>

  <g>
    <rect x="220" y="918" width="220" height="50" rx="8" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="330" y="950" class="box-title" text-anchor="middle">SQL warehouse</text>
  </g>

  <g>
    <rect x="640" y="918" width="220" height="50" rx="8" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="750" y="950" class="box-title" text-anchor="middle">Genie + AI/BI</text>
  </g>

  <path d="M 460 852 L 360 910" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 620 852 L 720 910" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>
