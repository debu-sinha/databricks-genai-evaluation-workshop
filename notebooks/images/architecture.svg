<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 860" width="1080" height="860" role="img" aria-label="MLflow GenAI evaluation workshop architecture">
  <defs>
    <style>
      .title { font: 700 30px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #7d8590; }
      .box-title { font: 600 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #ffffff; }
      .box-sub { font: 400 13px/1.3 "SF Mono", Menlo, monospace; fill: #ffffff; opacity: 0.85; }
      .box-detail { font: 400 12px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #ffffff; opacity: 0.7; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <text x="540" y="50" class="title" text-anchor="middle">MLflow GenAI evaluation workshop</text>

  <!-- Row 1: Agent → Trace -->
  <g>
    <rect x="140" y="120" width="240" height="100" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="260" y="160" class="box-title" text-anchor="middle">Your RAG agent</text>
    <text x="260" y="184" class="box-sub" text-anchor="middle">retrieve + generate</text>
  </g>

  <g>
    <rect x="500" y="120" width="380" height="100" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="690" y="155" class="box-title" text-anchor="middle">MLflow trace</text>
    <text x="690" y="179" class="box-sub" text-anchor="middle">chain to retrieve to LLM</text>
    <text x="690" y="200" class="box-detail" text-anchor="middle">+ user, session, tags metadata</text>
  </g>

  <path d="M 380 170 L 492 170" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Row 2: three signal sources that attach to traces -->
  <g>
    <rect x="80" y="320" width="280" height="140" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="220" y="355" class="box-title" text-anchor="middle">In-app feedback</text>
    <text x="220" y="380" class="box-sub" text-anchor="middle">mlflow.log_feedback</text>
    <text x="220" y="410" class="box-detail" text-anchor="middle">End-user thumbs up/down,</text>
    <text x="220" y="428" class="box-detail" text-anchor="middle">freeform ratings, source = HUMAN</text>
  </g>

  <g>
    <rect x="400" y="320" width="280" height="140" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="540" y="355" class="box-title" text-anchor="middle">Review App</text>
    <text x="540" y="380" class="box-sub" text-anchor="middle">labeling sessions</text>
    <text x="540" y="410" class="box-detail" text-anchor="middle">SME batch annotation against</text>
    <text x="540" y="428" class="box-detail" text-anchor="middle">a typed label schema</text>
  </g>

  <g>
    <rect x="720" y="320" width="280" height="140" rx="10" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
    <text x="860" y="355" class="box-title" text-anchor="middle">Automated scorers</text>
    <text x="860" y="380" class="box-sub" text-anchor="middle">@scorer + make_judge</text>
    <text x="860" y="410" class="box-detail" text-anchor="middle">Code or LLM, offline batch or</text>
    <text x="860" y="428" class="box-detail" text-anchor="middle">scheduled (Beta), 5-100% sampling</text>
  </g>

  <!-- Trace fans out to all three signal sources -->
  <path d="M 600 220 L 220 312" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 690 220 L 540 312" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 780 220 L 860 312" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Row 3: All three converge into UC -->
  <g>
    <rect x="360" y="540" width="360" height="110" rx="10" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
    <text x="540" y="578" class="box-title" text-anchor="middle">Traces in Unity Catalog</text>
    <text x="540" y="603" class="box-sub" text-anchor="middle">Delta table (Public Preview)</text>
    <text x="540" y="628" class="box-detail" text-anchor="middle">Trace + spans + assessments,</text>
    <text x="540" y="646" class="box-detail" text-anchor="middle">SQL queryable, ACL governed</text>
  </g>

  <!-- Three signal sources converge into UC -->
  <path d="M 220 462 L 460 532" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 540 462 L 540 532" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 860 462 L 620 532" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Row 4: UC fans out to consumers -->
  <g>
    <rect x="220" y="740" width="240" height="70" rx="10" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="340" y="781" class="box-title" text-anchor="middle">SQL warehouse</text>
  </g>

  <g>
    <rect x="620" y="740" width="240" height="70" rx="10" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="740" y="781" class="box-title" text-anchor="middle">Genie + AI/BI dashboards</text>
  </g>

  <path d="M 460 652 L 360 732" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 620 652 L 720 732" stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>
